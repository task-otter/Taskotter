---
name: CodSpeed
on:
  push:
    branches:
      - main
  pull_request:
  # `workflow_dispatch` lets CodSpeed trigger backtest performance analysis.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmarks:
    name: Run benchmarks
    # Switch to `codspeed-macro` once the repository has access to the CodSpeed
    # runner group: walltime results are far less noisy on macro runners.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for OIDC authentication with CodSpeed
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea  # v5.2.1
        with:
          mode: walltime
          run: go test -bench=. ./...
