---
name: Test TaskOtter
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  itself:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: TaskOtter
        id: taskotter
        uses: ./
        with:
          github-token: ${{ github.token }}
          fail-on-changes: true
          tasks: |
            go
            yamllint
            actionlint
            zizmor
            adrs
            hadolint
          js: |
            runtime: bun
          includes-doc: true
          target-folder: taskfiles
      - name: Print result
        if: always()
        shell: bash
        env:
          TASKOTTER_CHANGED: ${{ steps.taskotter.outputs.changed }}
          TASKOTTER_SOURCE_SHA: ${{ steps.taskotter.outputs.source-sha }}
          TASKOTTER_PULL_REQUEST_URL: ${{ steps.taskotter.outputs.pull-request-url }}
        run: |
          echo "Changed: ${TASKOTTER_CHANGED}"
          echo "Source SHA: ${TASKOTTER_SOURCE_SHA}"
          echo "Pull request: ${TASKOTTER_PULL_REQUEST_URL}"
  ci:
    runs-on: ubuntu-latest
    needs: itself
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.52.0
      - name: Run CI
        run: task ci
      - name: Run tests with coverage
        run: task taskotter:go:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          flags: unittests
          name: go-coverage
          disable_search: false
          fail_ci_if_error: true
          verbose: true
