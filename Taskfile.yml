---
version: '3.5'

env:
  GOTOOLCHAIN: go1.27.3

includes:
  taskotter:
    taskfile: taskotter/Taskfile.yml
    vars:
      GO_JUNIT_REPORT_IN: '{{.YAMLFIX_EXTRA_ARGS | default `test-result.txt`}}'
      GO_JUNIT_REPORT_OUT: '{{.YAMLFIX_EXTRA_ARGS | default `junit.xml`}}'
      YAMLFIX_EXTRA_ARGS: '{{.YAMLFIX_EXTRA_ARGS | default `--exclude "taskotter/**/*"`}}'

tasks:
  default:
    run: once
    desc: Show all available TaskOtter tasks
    cmds:
      - task --list-all
