---
version: "3.5"

includes:
  taskotter:
    taskfile: taskfiles/Taskfile.yml
tasks:
  ci:
    desc: Run CI checks
    cmds:
      - task: taskotter:golangci-lint:fmt:check
      - task: taskotter:lint
      - task: taskotter:go:test

  ci:fix:
    desc: Run CI fixs
    cmds:
      - task: taskotter:golangci-lint:fmt
      - task: taskotter:lint:fix
