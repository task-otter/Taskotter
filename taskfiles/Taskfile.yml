---
version: "3.5"
vars:
  EXTRA_ARGS: ""
  CONFIG: ""
  TARGETS: ""
  VERSION: ""
includes:
  go:
    taskfile: go/Taskfile.yml
    vars:
      INSTALL_DIR_UNIX: "/usr/local"
      GO_ROOT_UNIX: "{{.INSTALL_DIR_UNIX}}/go"
      GO_BIN_UNIX: "{{.GO_ROOT_UNIX}}/bin"
      GO_CMD_UNIX: "{{.GO_BIN_UNIX}}/go"
      GO_VERSION_URL: https://go.dev/VERSION?m=text
      GO_DOWNLOAD_BASE_URL: https://go.dev/dl
      GO_VERSION: ""
      GOLANGCI_LINT_VERSION: ""
      GOVULNCHECK_VERSION: ""
      GOSEC_VERSION: ""
      GO_FMT_SKIP_PATTERN: ""
      GO_LINT_SKIP_PATTERN: ""
      # Written next to the project's golangci-lint config so relative paths inside
      # the merged copy keep resolving. Overwritten on every run, never deleted.
      GO_INTERNAL_SKIP_CONFIG: ".golangci-taskotter-skip.yml"
      GO_COVER_PROFILE: ""
      GO_FUZZTIME: ""
      # Formatter selection shared by every golangci-lint fmt invocation (both the
      # skip-pattern and plain paths, on Unix and Windows). Kept in one place so the
      # four call sites cannot drift apart.
      GO_FMT_FORMATTER_FLAGS: >-
        -E gci -E gofmt -E gofumpt -E goimports -E golines -E swaggo
      GLOBAL_GO_BIN:
        sh: |
          gobin="${GOBIN:-}"
          if [ -z "$gobin" ] && command -v go >/dev/null 2>&1; then
            gobin="$(go env GOBIN)"
          fi
          if [ -z "$gobin" ]; then
            gopath="${GOPATH:-}"
            if [ -z "$gopath" ] && command -v go >/dev/null 2>&1; then
              gopath="$(go env GOPATH)"
            fi
            gobin="${gopath:-$HOME/go}/bin"
          fi
          printf '%s' "$gobin"
      GO_JUNIT_REPORT: ""
  eslint:
    taskfile: eslint/Taskfile.yml
    vars:
      ESLINT_LINT_SKIP_PATTERN: ""
      TARGETS: '{{.TARGETS}}'
      ESLINT_DEFAULT_TARGETS: "src/**/*.{js,jsx,ts,tsx}"
      CONFIG: '{{.CONFIG}}'
      CACHE: ""
      ESLINT_DEFAULT_CACHE: "true"
      EXTRA_ARGS: '{{.EXTRA_ARGS}}'
      VERSION: '{{.VERSION}}'
  prettier:
    taskfile: prettier/Taskfile.yml
    vars:
      PRETTIER_FMT_SKIP_PATTERN: ""
      TARGETS: '{{.TARGETS}}'
      PRETTIER_DEFAULT_TARGETS: "."
      CONFIG: '{{.CONFIG}}'
      IGNORE_PATH: ""
      PRETTIER_DEFAULT_IGNORE_PATH: ".prettierignore"
      EXTRA_ARGS: '{{.EXTRA_ARGS}}'
      VERSION: '{{.VERSION}}'
  typescript:
    taskfile: typescript/Taskfile.yml
    vars:
      FILE: src/index.ts
      OUTFILE: dist/index.js
      OUT_DIR: dist
      TSCONFIG: tsconfig.json
      TSX_FLAGS: ""
      TSC_FLAGS: ""
      TRACE_DIR: .tsc-trace
      VERSION: '{{.VERSION}}'
tasks:
  ci:
    desc: Run ci for synced TaskOtter modules
    cmds:
      - task: eslint:ci
      - task: prettier:ci
      - task: typescript:ci
  config:init:
    desc: Run config:init for synced TaskOtter modules
    cmds:
      - task: eslint:config:init
      - task: prettier:config:init
      - task: typescript:config:init
  help:
    desc: Run help for synced TaskOtter modules
    cmds:
      - task: eslint:help
      - task: prettier:help
  install:
    desc: Run install for synced TaskOtter modules
    cmds:
      - task: eslint:install
      - task: prettier:install
      - task: typescript:install
      - task: go:install
  install:undo:
    desc: Run install:undo for synced TaskOtter modules
    cmds:
      - task: eslint:install:undo
      - task: prettier:install:undo
      - task: typescript:install:undo
      - task: go:install:undo
  upgrade:
    desc: Run upgrade for synced TaskOtter modules
    cmds:
      - task: eslint:upgrade
      - task: prettier:upgrade
      - task: typescript:upgrade
      - task: go:upgrade
  version:
    desc: Run version for synced TaskOtter modules
    cmds:
      - task: eslint:version
      - task: prettier:version
      - task: typescript:version
      - task: go:version
