---
version: "3.5"
vars:
  ESLINT_CACHE: '{{.ESLINT_CACHE | default ""}}'
  ESLINT_CONFIG: '{{.ESLINT_CONFIG | default ""}}'
  ESLINT_DEFAULT_CACHE: '{{.ESLINT_DEFAULT_CACHE | default "true"}}'
  ESLINT_DEFAULT_TARGETS: '{{.ESLINT_DEFAULT_TARGETS | default "src/**/*.{js,jsx,ts,tsx}"}}'
  ESLINT_EXTRA_ARGS: '{{.ESLINT_EXTRA_ARGS | default ""}}'
  ESLINT_TARGETS: '{{.ESLINT_TARGETS | default ""}}'
  ESLINT_VERSION: '{{.ESLINT_VERSION | default ""}}'
  GO_FUZZTIME: '{{.GO_FUZZTIME | default ""}}'
  GO_NIX_INSTALLABLE: '{{.GO_NIX_INSTALLABLE | default "nixpkgs#go"}}'
  PRETTIER_CONFIG: '{{.PRETTIER_CONFIG | default ""}}'
  PRETTIER_DEFAULT_IGNORE_PATH: '{{.PRETTIER_DEFAULT_IGNORE_PATH | default ".prettierignore"}}'
  PRETTIER_DEFAULT_TARGETS: '{{.PRETTIER_DEFAULT_TARGETS | default "."}}'
  PRETTIER_EXTRA_ARGS: '{{.PRETTIER_EXTRA_ARGS | default ""}}'
  PRETTIER_IGNORE_PATH: '{{.PRETTIER_IGNORE_PATH | default ""}}'
  PRETTIER_TARGETS: '{{.PRETTIER_TARGETS | default ""}}'
  PRETTIER_VERSION: '{{.PRETTIER_VERSION | default ""}}'
  TYPESCRIPT_FILE: '{{.TYPESCRIPT_FILE | default "src/index.ts"}}'
  TYPESCRIPT_OUTFILE: '{{.TYPESCRIPT_OUTFILE | default "dist/index.js"}}'
  TYPESCRIPT_OUT_DIR: '{{.TYPESCRIPT_OUT_DIR | default "dist"}}'
  TYPESCRIPT_TRACE_DIR: '{{.TYPESCRIPT_TRACE_DIR | default ".tsc-trace"}}'
  TYPESCRIPT_TSCONFIG: '{{.TYPESCRIPT_TSCONFIG | default "tsconfig.json"}}'
  TYPESCRIPT_TSC_FLAGS: '{{.TYPESCRIPT_TSC_FLAGS | default ""}}'
  TYPESCRIPT_TSX_FLAGS: '{{.TYPESCRIPT_TSX_FLAGS | default ""}}'
  TYPESCRIPT_VERSION: '{{.TYPESCRIPT_VERSION | default ""}}'
includes:
  eslint:
    taskfile: eslint/Taskfile.yml
    dir: ..
    vars:
      ESLINT_TARGETS: '{{.ESLINT_TARGETS}}'
      ESLINT_DEFAULT_TARGETS: '{{.ESLINT_DEFAULT_TARGETS}}'
      ESLINT_CONFIG: '{{.ESLINT_CONFIG}}'
      ESLINT_CACHE: '{{.ESLINT_CACHE}}'
      ESLINT_DEFAULT_CACHE: '{{.ESLINT_DEFAULT_CACHE}}'
      ESLINT_EXTRA_ARGS: '{{.ESLINT_EXTRA_ARGS}}'
      ESLINT_VERSION: '{{.ESLINT_VERSION}}'
  prettier:
    taskfile: prettier/Taskfile.yml
    dir: ..
    vars:
      PRETTIER_TARGETS: '{{.PRETTIER_TARGETS}}'
      PRETTIER_DEFAULT_TARGETS: '{{.PRETTIER_DEFAULT_TARGETS}}'
      PRETTIER_CONFIG: '{{.PRETTIER_CONFIG}}'
      PRETTIER_IGNORE_PATH: '{{.PRETTIER_IGNORE_PATH}}'
      PRETTIER_DEFAULT_IGNORE_PATH: '{{.PRETTIER_DEFAULT_IGNORE_PATH}}'
      PRETTIER_EXTRA_ARGS: '{{.PRETTIER_EXTRA_ARGS}}'
      PRETTIER_VERSION: '{{.PRETTIER_VERSION}}'
  typescript:
    taskfile: typescript/Taskfile.yml
    dir: ..
    vars:
      TYPESCRIPT_FILE: '{{.TYPESCRIPT_FILE}}'
      TYPESCRIPT_OUTFILE: '{{.TYPESCRIPT_OUTFILE}}'
      TYPESCRIPT_OUT_DIR: '{{.TYPESCRIPT_OUT_DIR}}'
      TYPESCRIPT_TSCONFIG: '{{.TYPESCRIPT_TSCONFIG}}'
      TYPESCRIPT_TSX_FLAGS: '{{.TYPESCRIPT_TSX_FLAGS}}'
      TYPESCRIPT_TSC_FLAGS: '{{.TYPESCRIPT_TSC_FLAGS}}'
      TYPESCRIPT_TRACE_DIR: '{{.TYPESCRIPT_TRACE_DIR}}'
      TYPESCRIPT_VERSION: '{{.TYPESCRIPT_VERSION}}'
  go:
    taskfile: go/Taskfile.yml
    dir: ..
    vars:
      GO_NIX_INSTALLABLE: '{{.GO_NIX_INSTALLABLE}}'
      GO_FUZZTIME: '{{.GO_FUZZTIME}}'
tasks:
  ci:
    desc: Run ci for synced TaskOtter modules
    cmds:
      - task: eslint:ci
      - task: typescript:ci
  ci:fix:
    desc: Run ci:fix for synced TaskOtter modules
    cmds:
      - task: eslint:ci:fix
      - task: prettier:ci:fix
  config:init:
    desc: Run config:init for synced TaskOtter modules
    cmds:
      - task: eslint:config:init
      - task: prettier:config:init
      - task: typescript:config:init
  help:
    desc: Run help for synced TaskOtter modules
    cmds:
      - task: eslint:help
      - task: prettier:help
  install:
    desc: Run install for synced TaskOtter modules
    cmds:
      - task: eslint:install
      - task: prettier:install
      - task: typescript:install
      - task: go:install
  install:undo:
    desc: Run install:undo for synced TaskOtter modules
    cmds:
      - task: eslint:install:undo
      - task: prettier:install:undo
      - task: typescript:install:undo
  upgrade:
    desc: Run upgrade for synced TaskOtter modules
    cmds:
      - task: eslint:upgrade
      - task: prettier:upgrade
      - task: typescript:upgrade
  version:
    desc: Run version for synced TaskOtter modules
    cmds:
      - task: eslint:version
      - task: prettier:version
      - task: typescript:version
      - task: go:version
