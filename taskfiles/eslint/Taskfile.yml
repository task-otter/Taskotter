---
version: "3.5"
output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false
silent: true
includes:
  pnpm:
    taskfile: ../../../../pnpm/Taskfile.yml
vars:
  ESLINT_LINT_SKIP_PATTERN: ""
  TARGETS: ""
  ESLINT_DEFAULT_TARGETS: "src/**/*.{js,jsx,ts,tsx}"
  CONFIG: ""
  CACHE: ""
  ESLINT_DEFAULT_CACHE: "true"
  EXTRA_ARGS: ""
  VERSION: ""
tasks:
  default:
    run: once
    desc: Show available ESLint tasks
    cmds:
      - task --list
  install:
    run: once
    desc: Install ESLint as a local devDependency
    summary: |
      Install eslint as a local devDependency. Pass VERSION=x.y.z to pin a
      specific release instead of the package manager's default resolution.
    vars:
      RESOLVED_VERSION: '{{default .VERSION .VERSION_OVERRIDE}}'
      RESOLVED_EXTRA_ARGS: '{{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}'
    status:
      - >-
        node -e "const installed = require('./node_modules/eslint/package.json'); const requested = '{{.RESOLVED_VERSION}}'; process.exit(!requested || installed.version === requested ? 0 : 1)"
    cmds:
      - task: pnpm:add
        vars:
          PACKAGES: 'eslint{{if .RESOLVED_VERSION}}@{{.RESOLVED_VERSION}}{{end}}'
          EXTRA_ARGS: '{{.RESOLVED_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}'
  install:undo:
    run: once
    desc: Remove the locally installed ESLint devDependency
    summary: Remove eslint from local devDependencies via the active package manager.
    prompt:
      - This will remove eslint from local devDependencies.
      - Continue?
    cmds:
      - task: pnpm:remove
        vars:
          PACKAGES: eslint
          EXTRA_ARGS: '{{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}'
  upgrade:
    run: once
    desc: Upgrade ESLint to the latest release
    summary: Reinstall eslint at the latest version as a local devDependency.
    cmds:
      - task: pnpm:add
        vars:
          PACKAGES: eslint@latest
          EXTRA_ARGS: '{{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}'
  init:
    run: once
    desc: Alias for eslint:config:init
    cmds:
      - task: config:init
  config:init:
    run: once
    desc: Run the ESLint config initialization wizard
    summary: |
      Run eslint --init to scaffold an ESLint config file interactively.
      Skipped if a recognized ESLint config file already exists in the
      current directory (eslint.config.js/mjs/cjs or .eslintrc.*).
    vars:
      RESOLVED_EXTRA_ARGS: '{{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}'
    status:
      - >-
        test -f eslint.config.js || test -f eslint.config.mjs || test -f eslint.config.cjs || test -f .eslintrc.js || test -f .eslintrc.cjs || test -f .eslintrc.json || test -f .eslintrc.yml || test -f .eslintrc.yaml
    cmds:
      - task: pnpm:exec
        vars:
          BINARY: eslint
          ARGS: "--init"
          EXTRA_ARGS: '{{.RESOLVED_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}'
  # Shared implementation of lint / lint:fix / ci. Each override is resolved
  # exactly once here; the three public tasks differ only by MODE_ARGS.
  _run:
    internal: true
    run: when_changed
    vars:
      RESOLVED_CONFIG: '{{default .CONFIG .CONFIG_OVERRIDE}}'
      RESOLVED_CACHE: '{{or .CACHE_OVERRIDE .CACHE .ESLINT_DEFAULT_CACHE}}'
      RESOLVED_SKIP: '{{default .ESLINT_LINT_SKIP_PATTERN .ESLINT_LINT_SKIP_PATTERN_OVERRIDE}}'
      RESOLVED_TARGETS: '{{or .ESLINT_TARGETS_OVERRIDE .TARGETS .ESLINT_DEFAULT_TARGETS}}'
      RESOLVED_EXTRA_ARGS: '{{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}'
    cmds:
      - task: pnpm:exec
        vars:
          BINARY: eslint
          ARGS: >-
            {{if .RESOLVED_CONFIG}}--config "{{.RESOLVED_CONFIG}}" {{end}} {{- if eq .RESOLVED_CACHE "true"}}--cache --cache-location .cache/eslint/ {{end}} {{- if .MODE_ARGS}}{{.MODE_ARGS}} {{end}} {{- if .RESOLVED_SKIP}}--ignore-pattern "{{.RESOLVED_SKIP}}" {{end}} {{- .RESOLVED_TARGETS}}
          EXTRA_ARGS: '{{.RESOLVED_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}'
  lint:
    run: once
    desc: Lint targets with ESLint
    cmds:
      - task: _run
        vars:
          MODE_ARGS: ""
      - echo "✅ eslint passed"
  lint:fix:
    run: once
    desc: Lint targets with ESLint and apply fixes
    cmds:
      - task: _run
        vars:
          MODE_ARGS: "--fix"
      - echo "✅ eslint fixes applied"
  ci:
    run: once
    desc: Run ESLint with zero-warning CI enforcement
    cmds:
      - task: _run
        vars:
          MODE_ARGS: "--max-warnings=0"
      - echo "✅ eslint passed"
  cache:clean:
    run: once
    desc: Remove the ESLint cache directory
    cmds:
      - if [ -d .cache/eslint ]; then rm -rf .cache/eslint; fi
  version:
    run: once
    desc: Show the locally resolved ESLint version
    cmds:
      - task: pnpm:exec
        vars:
          BINARY: eslint
          ARGS: "--version"
  help:
    run: once
    desc: Show ESLint CLI help
    cmds:
      - task: pnpm:exec
        vars:
          BINARY: eslint
          ARGS: "--help"
          EXTRA_ARGS: '{{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}'
