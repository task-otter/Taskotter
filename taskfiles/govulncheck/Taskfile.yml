---
version: "3.5"
output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false
silent: true
includes:
  go:
    taskfile: ../go/Taskfile.yml
  skipfiles:
    taskfile: ../internal/skipfiles/Taskfile.yml
    internal: true
vars:
  GOVULNCHECK_VERSION: ""
  GOVULNCHECK_LINT_SKIP_PATTERN: ""
  GO_GLOBAL_BIN:
    sh: |
      gobin="${GOBIN:-}"
      if [ -z "$gobin" ] && command -v go >/dev/null 2>&1; then
        gobin="$(go env GOBIN)"
      fi
      if [ -z "$gobin" ]; then
        gopath="${GOPATH:-}"
        if [ -z "$gopath" ] && command -v go >/dev/null 2>&1; then
          gopath="$(go env GOPATH)"
        fi
        gobin="${gopath:-$HOME/go}/bin"
      fi
      printf '%s' "$gobin"
tasks:
  default:
    run: once
    desc: Show available govulncheck automation tasks
    summary: Display the list of available govulncheck-related tasks defined in this Taskfile.
    cmds:
      - task --list
  install:
    run: once
    desc: Install govulncheck globally
    summary: Install GOVULNCHECK_VERSION, defaulting to latest, into the global Go bin.
    deps:
      - task: go:install
    cmds:
      - cmd: >-
          GOBIN="{{.GO_GLOBAL_BIN}}" go install golang.org/x/vuln/cmd/govulncheck@{{default "latest"
          .GOVULNCHECK_VERSION}}
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "$env:GOBIN = '{{.GO_GLOBAL_BIN}}';
          go install golang.org/x/vuln/cmd/govulncheck@{{default "latest" .GOVULNCHECK_VERSION}}"
        platforms: [windows]
    status:
      - >-
        {{if eq .OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -Command
        "if (-not (Test-Path '{{.GO_GLOBAL_BIN}}/govulncheck.exe')) { exit 1 };
        $requested = '{{.GOVULNCHECK_VERSION}}';
        if ([string]::IsNullOrWhiteSpace($requested) -or $requested -eq 'latest') { exit 0 };
        if ((go version -m '{{.GO_GLOBAL_BIN}}/govulncheck.exe') -like ('*' + $requested + '*')) { exit 0 };
        exit 1"{{else}}test -x "{{.GO_GLOBAL_BIN}}/govulncheck" && { test -z "{{.GOVULNCHECK_VERSION}}" || test
        "{{.GOVULNCHECK_VERSION}}" = "latest" || go version -m "{{.GO_GLOBAL_BIN}}/govulncheck" | awk -v
        want="{{.GOVULNCHECK_VERSION}}" '$1 == "mod" && $3 == want { found = 1 } END { exit !found }'; }{{end}}
  ci:
    run: once
    desc: Scan Go packages with govulncheck
    summary: |
      Scan all Go packages for known vulnerabilities by default. Pass CLI
      arguments after -- to override the default ./... target. Auto-installs
      govulncheck if missing. Packages containing files matched by
      GOVULNCHECK_LINT_SKIP_PATTERN are omitted.
    deps:
      - task: install
    cmds:
      - task: _scan
  _scan:
    internal: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - cmd: |
          skip_pattern='{{if .GOVULNCHECK_LINT_SKIP_PATTERN_OVERRIDE}}{{.GOVULNCHECK_LINT_SKIP_PATTERN_OVERRIDE}}
          {{- else}}{{.GOVULNCHECK_LINT_SKIP_PATTERN}}{{end}}'
          if [ -z "$skip_pattern" ]; then
            "{{.GO_GLOBAL_BIN}}/govulncheck" \
              {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}./...{{end}}
            exit
          fi
          targets=''
          options=''
          for argument in {{.CLI_ARGS}}; do
            case "$argument" in
              .|*/*|*\\*|*...) targets="$targets $argument" ;;
              *) options="$options $argument" ;;
            esac
          done
          [ -n "$targets" ] || targets='./...'
          package_list="$(mktemp)"
          trap 'rm -f "$package_list"' EXIT
          export SKIPFILES_PATTERN="$skip_pattern"
          export SKIPFILES_GO_TARGETS="$targets"
          # Propagate an enumeration failure instead of letting it look like an
          # empty package set: `go list` exits non-zero when a package does not
          # compile, and reporting success there would silently skip the scan.
          enumerate_status=0
          task --silent --taskfile "{{.TASKFILE_DIR}}/../internal/skipfiles/Taskfile.yml" \
            go-packages >"$package_list" || enumerate_status=$?
          if [ "$enumerate_status" -ne 0 ]; then
            echo 'Failed to enumerate Go packages' >&2
            exit "$enumerate_status"
          fi
          if [ ! -s "$package_list" ]; then
            echo 'No matching Go packages found'
            exit 0
          fi
          xargs -0 "{{.GO_GLOBAL_BIN}}/govulncheck" $options <"$package_list"
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$skipPattern='{{if
          .GOVULNCHECK_LINT_SKIP_PATTERN_OVERRIDE}}{{.GOVULNCHECK_LINT_SKIP_PATTERN_OVERRIDE}} {{-
          else}}{{.GOVULNCHECK_LINT_SKIP_PATTERN}}{{end}}'; if (-not $skipPattern) {

            & '{{.GO_GLOBAL_BIN}}/govulncheck'
              {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}./...{{end}};
            exit $LASTEXITCODE
          }; $targets=@(); $options=@(); foreach ($argument in '{{.CLI_ARGS}}'.Split(' ',
          [System.StringSplitOptions]::RemoveEmptyEntries)) {

            if ($argument -eq '.' -or $argument.Contains('/') -or
                $argument.Contains('\') -or $argument.EndsWith('...')) {
              $targets += $argument
            } else { $options += $argument }
          }; if (-not $targets) { $targets=@('./...') }; $env:SKIPFILES_PATTERN = $skipPattern;
          $env:SKIPFILES_GO_TARGETS = $targets -join ' '; $packages=@(& task --silent

            --taskfile '{{.TASKFILE_DIR}}/../internal/skipfiles/Taskfile.yml'
            go-packages);
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; if (-not $packages) { Write-Host 'No matching Go packages
          found'; exit 0 }; & '{{.GO_GLOBAL_BIN}}/govulncheck' @options @packages; exit
          $LASTEXITCODE"
        platforms: [windows]
