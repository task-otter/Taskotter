---
version: "3.5"

output:

  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:

  nodejs:
    taskfile: ../nodejs/Taskfile.yml

  nix:
    taskfile: ../nix/Taskfile.yml

vars:

  PNPM_NIX_INSTALLABLE: '{{.PNPM_NIX_INSTALLABLE | default "nixpkgs#pnpm"}}'

tasks:
  install:tool:
    run: once
    desc: Install pnpm via the Nix profile
    summary: |
      Install pnpm into the user Nix profile when it is not already
      available on PATH. Override the PNPM_NIX_INSTALLABLE
      variable to pin a different package or version.
    status:
      - bash -lc '{{.NIX_LOAD}}; command -v pnpm >/dev/null 2>&1'
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.PNPM_NIX_INSTALLABLE}}"

  version:tool:
    run: once
    desc: Show the active pnpm version
    summary: |
      Print the version reported by the pnpm binary resolved from PATH.
      Auto-installs pnpm if missing.
    deps:
      - task: install:tool
    cmds:
      - task: _version:tool:unix
      - task: _version:tool:windows

  default:
    run: once
    desc: Show available pnpm automation tasks
    summary: Display the list of available pnpm-related tasks defined in this Taskfile.
    cmds:
      - task --list

  version:
    run: once
    desc: Show the active Node.js and pnpm versions
    summary: Print Node.js and pnpm versions after loading the selected Node.js runtime.
    cmds:
      - task: _version:unix
      - task: _version:windows

  install:
    run: once
    desc: Install project dependencies with pnpm
    summary: Run pnpm install from a project root that contains package.json.
    cmds:
      - task: _pnpm:unix
        vars: { ARGS: install --silent }
      - task: _pnpm:windows
        vars: { ARGS: install --silent }

  install:clean:
    run: once
    desc: Clean install project dependencies from the lockfile
    summary: Run pnpm install --frozen-lockfile (install:clean) and require pnpm-lock.yaml.
    cmds:
      - task: _install:clean:unix
      - task: _install:clean:windows

  ci:fix:
    run: once
    desc: Format source files with pnpm
    summary: Execute the format script defined in package.json through pnpm run format.
    cmds:
      - task: _pnpm:unix
        vars: { ARGS: run format }
      - task: _pnpm:windows
        vars: { ARGS: run format }

  add:
    run: once
    desc: Install packages as local devDependencies with pnpm (PACKAGES=<pkgs>)
    summary: |
      Install PACKAGES as local devDependencies via pnpm add -D.
      Pass EXTRA_ARGS for additional pnpm flags.
    requires:
      vars: [PACKAGES]
    cmds:
      - task: _pnpm:unix
        vars:
          ARGS: "add -D --silent {{.PACKAGES}} {{.EXTRA_ARGS}}"
      - task: _pnpm:windows
        vars:
          ARGS: "add -D --silent {{.PACKAGES}} {{.EXTRA_ARGS}}"

  remove:
    run: once
    desc: Remove local packages with pnpm (PACKAGES=<pkgs>)
    summary: |
      Remove PACKAGES from the local project via pnpm remove.
      Pass EXTRA_ARGS for additional pnpm flags.
    requires:
      vars: [PACKAGES]
    cmds:
      - task: _pnpm:unix
        vars:
          ARGS: "remove --silent {{.PACKAGES}} {{.EXTRA_ARGS}}"
      - task: _pnpm:windows
        vars:
          ARGS: "remove --silent {{.PACKAGES}} {{.EXTRA_ARGS}}"

  install:undo:
    run: once
    desc: Explain how to remove pnpm from the Nix profile
    summary: |
      pnpm is installed via nix profile. Remove with nix profile remove or
      override PNPM_NIX_INSTALLABLE.
    cmds:
      - echo 'pnpm is installed via nix profile.'
      - "echo 'Remove with nix profile remove or reinstall via PNPM_NIX_INSTALLABLE.'"

  upgrade:
    run: once
    desc: Upgrade pnpm via the Nix profile
    summary: Reinstall pnpm using PNPM_NIX_INSTALLABLE (default nixpkgs#pnpm).
    cmds:
      - task: install:tool

  exec:
    run: once
    desc: Execute a global binary via pnpm (BINARY=<name>)
    requires:
      vars: [BINARY]
    cmds:
      - task: _exec:unix
        vars:
          BINARY: "{{.BINARY}}"
          ARGS: "{{.ARGS}}"
          EXTRA_ARGS: "{{.EXTRA_ARGS}}"
      - task: _exec:windows
        vars:
          BINARY: "{{.BINARY}}"
          ARGS: "{{.ARGS}}"
          EXTRA_ARGS: "{{.EXTRA_ARGS}}"

  run:
    run: once
    desc: Run a package.json script with pnpm
    summary: Run SCRIPT through pnpm run and forward arguments passed after --.
    requires:
      vars: [SCRIPT]
    cmds:
      - task: _run:unix
        vars:
          SCRIPT: "{{.SCRIPT}}"
          CLI_ARGS: "{{.CLI_ARGS}}"
      - task: _run:windows
        vars:
          SCRIPT: "{{.SCRIPT}}"
          CLI_ARGS: "{{.CLI_ARGS}}"

  dev:
    run: once
    desc: Start the development script with pnpm
    summary: Execute the dev script defined in package.json through pnpm run dev.
    cmds:
      - task: _pnpm:unix
        vars: { ARGS: run dev }
      - task: _pnpm:windows
        vars: { ARGS: run dev }

  test:
    run: once
    desc: Run the project test script with pnpm
    summary: Execute the test script defined in package.json through pnpm test.
    cmds:
      - task: _pnpm:unix
        vars: { ARGS: test }
      - task: _pnpm:windows
        vars: { ARGS: test }

  build:
    run: once
    desc: Build the project with pnpm
    summary: Execute the build script defined in package.json through pnpm run build.
    cmds:
      - task: _pnpm:unix
        vars: { ARGS: run build }
      - task: _pnpm:windows
        vars: { ARGS: run build }

  lint:
    run: once
    desc: Lint the project with pnpm
    summary: Execute the lint script defined in package.json through pnpm run lint.
    cmds:
      - task: _pnpm:unix
        vars: { ARGS: run lint }
      - task: _pnpm:windows
        vars: { ARGS: run lint }

  typecheck:
    run: once
    desc: Type check the project with pnpm
    summary: Execute the typecheck script defined in package.json through pnpm run typecheck.
    cmds:
      - task: _pnpm:unix
        vars: { ARGS: run typecheck }
      - task: _pnpm:windows
        vars: { ARGS: run typecheck }

  outdated:
    run: once
    desc: List outdated pnpm packages locally
    summary: Run pnpm outdated for review and ignore its non-zero outdated result.
    cmds:
      - task: _pnpm:unix
        vars: { ARGS: outdated }
        ignore_error: true
      - task: _pnpm:windows
        vars: { ARGS: outdated }
        ignore_error: true

  outdated:strict:
    run: once
    desc: List outdated pnpm packages strictly
    summary: Run pnpm outdated and propagate the pnpm exit code for CI enforcement.
    cmds:
      - task: _pnpm:unix
        vars: { ARGS: outdated }
      - task: _pnpm:windows
        vars: { ARGS: outdated }

  update:
    run: once
    desc: Update dependencies with pnpm
    summary: Run pnpm update to update installed dependencies within declared ranges.
    cmds:
      - task: _pnpm:unix
        vars: { ARGS: update }
      - task: _pnpm:windows
        vars: { ARGS: update }

  audit:
    run: once
    desc: Run a strict pnpm vulnerability audit
    summary: Run pnpm audit and propagate vulnerability findings for CI enforcement.
    cmds:
      - task: _pnpm:unix
        vars: { ARGS: audit }
      - task: _pnpm:windows
        vars: { ARGS: audit }

  audit:report:
    run: once
    desc: Report pnpm vulnerabilities locally
    summary: Run pnpm audit for local review while ignoring its vulnerability exit code.
    cmds:
      - task: _pnpm:unix
        vars: { ARGS: audit }
        ignore_error: true
      - task: _pnpm:windows
        vars: { ARGS: audit }
        ignore_error: true

  audit:fix:
    run: once
    desc: Fix pnpm audit findings when possible
    summary: Run pnpm audit --fix to apply available dependency vulnerability fixes.
    cmds:
      - task: _pnpm:unix
        vars: { ARGS: audit --fix }
      - task: _pnpm:windows
        vars: { ARGS: audit --fix }

  audit:json:
    run: once
    desc: Output pnpm audit results as JSON
    summary: Run pnpm audit --json for tooling and propagate the pnpm audit exit code.
    cmds:
      - task: _pnpm:unix
        vars: { ARGS: audit --json }
      - task: _pnpm:windows
        vars: { ARGS: audit --json }

  store:prune:
    run: once
    desc: Prune the pnpm content-addressable store
    summary: Run pnpm store prune to remove unreferenced packages from the pnpm store.
    cmds:
      - task: _pnpm:unix
        vars: { ARGS: store prune }
      - task: _pnpm:windows
        vars: { ARGS: store prune }

  clean:
    run: once
    desc: Remove the node_modules directory
    summary: Delete the project node_modules directory before a fresh pnpm install.
    prompt:
      - This will delete the node_modules directory.
      - Continue?
    cmds:
      - task: _clean:unix
      - task: _clean:windows

  clean:all:
    run: once
    desc: Remove node_modules and pnpm-lock.yaml
    summary: Delete node_modules and pnpm-lock.yaml so a later pnpm install regenerates the lockfile.
    prompt:
      - "WARNING: This will permanently delete node_modules AND pnpm-lock.yaml."
      - Continue?
    cmds:
      - task: _clean:all:unix
      - task: _clean:all:windows

  _exec:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    set: [errexit, nounset, pipefail]
    requires:
      vars: [BINARY]
    cmds:
      - bash -c "{{.BINARY}} {{.ARGS}} {{.EXTRA_ARGS}}"

  _exec:windows:
    run: once
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    requires:
      vars: [BINARY]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -Command "& {{.BINARY}} {{.ARGS}} {{.EXTRA_ARGS}}"

  _pnpm:unix:
    run: when_changed
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    set: [errexit, nounset, pipefail]
    requires:
      vars:
        - ARGS
    env:
      CI: "1"
    deps:
      - task: nodejs:install
      - task: install:tool
    preconditions:
      - sh: 'test -f "{{.USER_WORKING_DIR}}/package.json"'
        msg: "package.json not found. Run this task from the project root."
    cmds:
      - bash -lc '{{.NIX_LOAD}}; pnpm {{.ARGS}}'

  _pnpm:windows:
    run: when_changed
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    requires:
      vars:
        - ARGS
    env:
      CI: "1"
    deps:
      - task: nodejs:install
      - task: install:tool
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Test-Path '{{.USER_WORKING_DIR}}/package.json') { exit 0 } else { exit 1 }"
        msg: "package.json not found. Run this task from the project root."
    cmds:
      - >-
        powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command
        "$ErrorActionPreference = 'Stop'; $env:CI = '1'; pnpm {{.ARGS}}"

  _install:clean:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    preconditions:
      - sh: 'test -f "{{.USER_WORKING_DIR}}/pnpm-lock.yaml"'
        msg: "pnpm-lock.yaml not found. pnpm install:clean requires a lockfile."
    cmds:
      - task: _pnpm:unix
        vars: { ARGS: install --frozen-lockfile --silent }

  _install:clean:windows:
    run: once
    internal: true
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Test-Path '{{.USER_WORKING_DIR}}\pnpm-lock.yaml') { exit 0 } else { exit 1 }"
        msg: "pnpm-lock.yaml not found. pnpm install:clean requires a lockfile."
    cmds:
      - task: _pnpm:windows
        vars: { ARGS: install --frozen-lockfile --silent }

  _run:unix:
    run: when_changed
    internal: true
    platforms: [linux, darwin]
    env:
      SCRIPT: "{{.SCRIPT}}"
    preconditions:
      - sh: 'printf "%s" "$SCRIPT" | grep -qE "^[A-Za-z0-9:_-]+$"'
        msg: 'SCRIPT "{{.SCRIPT}}" contains invalid characters.'
    cmds:
      - task: _pnpm:unix
        vars:
          ARGS: "run {{.SCRIPT}}{{if .CLI_ARGS}} -- {{.CLI_ARGS}}{{end}}"

  _run:windows:
    run: when_changed
    internal: true
    platforms: [windows]
    env:
      SCRIPT: "{{.SCRIPT}}"
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if ($env:SCRIPT -match '^[A-Za-z0-9:_-]+$') { exit 0 } else { exit 1 }"
        msg: 'SCRIPT "{{.SCRIPT}}" contains invalid characters.'
    cmds:
      - task: _pnpm:windows
        vars:
          ARGS: "run {{.SCRIPT}}{{if .CLI_ARGS}} -- {{.CLI_ARGS}}{{end}}"

  _version:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    deps:
      - task: nodejs:install
      - task: install:tool
    cmds:
      - bash -lc '{{.NIX_LOAD}}; node --version; pnpm --version'

  _version:windows:
    run: once
    internal: true
    platforms: [windows]
    deps:
      - task: nodejs:install
      - task: install:tool
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -Command "node --version; pnpm --version"

  _clean:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    status: ["test ! -d node_modules"]
    cmds: [rm -rf node_modules]

  _clean:windows:
    run: once
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    status:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "if (Test-Path 'node_modules') { exit 1 } else { exit 0 }"
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -Command "Remove-Item -Recurse -Force 'node_modules'"

  _clean:all:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - rm -rf node_modules
      - rm -f pnpm-lock.yaml

  _clean:all:windows:
    run: once
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "if (Test-Path 'node_modules') { Remove-Item -Recurse -Force 'node_modules' };
        if (Test-Path 'pnpm-lock.yaml') { Remove-Item -Force 'pnpm-lock.yaml' }"

  _version:tool:unix:
    run: once
    internal: true
    desc: Show pnpm version on macOS or Linux
    summary: Print the pnpm version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; pnpm --version'

  _version:tool:windows:
    run: once
    internal: true
    desc: Show pnpm version on Windows
    summary: Print the pnpm version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command "if (Get-Command pnpm -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: pnpm is not installed or not available in PATH.
    cmds:
      - pnpm --version
