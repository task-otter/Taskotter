---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  cargo:
    taskfile: ../cargo/Taskfile.yml
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  ADRS_NIX_INSTALLABLE: '{{.ADRS_NIX_INSTALLABLE | default "nixpkgs#adrs"}}'
  ADRS_CARGO_CRATE: '{{.ADRS_CARGO_CRATE | default "adrs"}}'
  ADRS_EXTRA_ARGS: '{{.ADRS_EXTRA_ARGS | default ""}}'

tasks:
  default:
    run: once
    desc: Show available adrs automation tasks
    summary: Display the list of available adrs-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install adrs via Nix (Unix) or cargo install (Windows)
    summary: |
      Install adrs into the user Nix profile on Linux and macOS when it
      is not already on PATH. On Windows, install via cargo:install:crate
      (ADRS_CARGO_CRATE). Override ADRS_NIX_INSTALLABLE or ADRS_CARGO_CRATE
      to pin a different package or crate.
    status:
      - command -v adrs >/dev/null 2>&1
    cmds:
      - task: _install:unix
      - task: _install:windows

  _install:unix:
    internal: true
    platforms: [linux, darwin]
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.ADRS_NIX_INSTALLABLE}}"

  _install:windows:
    internal: true
    platforms: [windows]
    cmds:
      - task: cargo:install:crate
        vars:
          CARGO_CRATE: "{{.ADRS_CARGO_CRATE}}"

  version:
    run: once
    desc: Show the active adrs version
    summary: |
      Print the version reported by the adrs binary resolved from PATH.
      Auto-installs adrs if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  init:
    run: once
    desc: Initialize an ADR repository (ADRS_EXTRA_ARGS=flags)
    summary: |
      Run adrs init to set up an Architecture Decision Record repository in
      the current directory. Pass ADRS_EXTRA_ARGS or arguments after -- for flags
      such as a custom directory. Auto-installs adrs if missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          adrs init
          {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.ADRS_EXTRA_ARGS}}{{end}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "adrs init {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.ADRS_EXTRA_ARGS}}{{end}}"
        platforms: [windows]

  new:
    run: once
    desc: Create a new ADR (ADRS_EXTRA_ARGS="title" or -- "title")
    summary: |
      Run adrs new to create a new Architecture Decision Record. Pass the
      title via ADRS_EXTRA_ARGS or after --. Auto-installs adrs if missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          adrs new
          {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.ADRS_EXTRA_ARGS}}{{end}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "adrs new {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.ADRS_EXTRA_ARGS}}{{end}}"
        platforms: [windows]

  list:
    run: once
    desc: List all ADRs in the repository (ADRS_EXTRA_ARGS=flags)
    summary: |
      Run adrs list to show the Architecture Decision Records in the current
      repository. Pass ADRS_EXTRA_ARGS or arguments after -- for flags.
      Auto-installs adrs if missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          adrs list
          {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.ADRS_EXTRA_ARGS}}{{end}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "adrs list {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.ADRS_EXTRA_ARGS}}{{end}}"
        platforms: [windows]

  generate:
    run: once
    desc: Generate ADR docs (ADRS_EXTRA_ARGS="toc|graph|book")
    summary: |
      Run adrs generate to build ADR documentation such as a table of
      contents, a graph, or a book. Pass the generator name via ADRS_EXTRA_ARGS or
      after --. Auto-installs adrs if missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          adrs generate
          {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.ADRS_EXTRA_ARGS}}{{end}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "adrs generate {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.ADRS_EXTRA_ARGS}}{{end}}"
        platforms: [windows]

  exec:
    run: once
    desc: Run any adrs subcommand (ADRS_EXTRA_ARGS or -- args)
    summary: |
      Run an arbitrary adrs subcommand. Pass the subcommand and its arguments
      via ADRS_EXTRA_ARGS or after --. Auto-installs adrs if missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          adrs
          {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.ADRS_EXTRA_ARGS}}{{end}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "adrs {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.ADRS_EXTRA_ARGS}}{{end}}"
        platforms: [windows]

  _version:unix:
    run: once
    internal: true
    desc: Show adrs version on macOS or Linux
    summary: Print the adrs version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; adrs --version'

  _version:windows:
    run: once
    internal: true
    desc: Show adrs version on Windows
    summary: Print the adrs version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command adrs -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: adrs is not installed or not available in PATH.
    cmds:
      - adrs --version
