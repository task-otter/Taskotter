---
version: "3.5"
output:

  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false
silent: true

includes:

  go:
    taskfile: ../go/Taskfile.yml

  nix:
    taskfile: ../nix/Taskfile.yml

vars:

  GO_JUNIT_REPORT_NIX_INSTALLABLE: '{{.GO_JUNIT_REPORT_NIX_INSTALLABLE | default "nixpkgs#go-junit-report"}}'

  GO_JUNIT_REPORT_IN: '{{.GO_JUNIT_REPORT_IN | default ""}}'

  GO_JUNIT_REPORT_OUT: '{{.GO_JUNIT_REPORT_OUT | default ""}}'

tasks:
  default:
    run: once
    desc: Show available go-junit-report automation tasks
    summary: Display the list of available go-junit-report-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install go-junit-report via the Nix profile
    summary: |
      Install go-junit-report into the user Nix profile when it is not already
      available on PATH. Override the GO_JUNIT_REPORT_NIX_INSTALLABLE
      variable to pin a different package or version. Go is provided by the
      included go Taskfile (go:install), not this installable.
    status:
      - command -v go-junit-report >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.GO_JUNIT_REPORT_NIX_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active go-junit-report version
    summary: |
      Print the version reported by the go-junit-report binary resolved from PATH.
      Auto-installs Go and go-junit-report if missing.
    deps:
      - task: go:install
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  which:
    run: once
    desc: Show the path to the go-junit-report binary
    summary: |
      Print the go-junit-report binary resolved from PATH. Auto-installs Go and
      go-junit-report if missing.
    deps:
      - task: go:install
      - task: install
    cmds:
      - task: _which:unix
      - task: _which:windows

  verify:
    run: once
    desc: Verify the go-junit-report installation
    summary: |
      Check that go-junit-report is installed and print the active version for
      quick installation diagnostics. Auto-installs Go and go-junit-report if
      missing.
    deps:
      - task: go:install
      - task: install
    cmds:
      - task: _verify:unix
      - task: _verify:windows

  report:
    run: once
    dir: "{{.USER_WORKING_DIR}}"
    desc: Convert a go test log file to JUnit XML
    summary: |
      Convert an existing go test log file to JUnit XML via go-junit-report.
      Requires GO_JUNIT_REPORT_IN (input log path) and GO_JUNIT_REPORT_OUT
      (output XML path). Does not run go test or write coverage profiles.
      Auto-installs Go (via go:install) and go-junit-report if missing.
    deps:
      - task: go:install
      - task: install
    requires:
      vars: [GO_JUNIT_REPORT_IN, GO_JUNIT_REPORT_OUT]
    preconditions:
      - sh: test -n "{{.GO_JUNIT_REPORT_IN}}"
        msg: GO_JUNIT_REPORT_IN is required. Pass GO_JUNIT_REPORT_IN=path/to/gotest.log when running this task.
      - sh: test -n "{{.GO_JUNIT_REPORT_OUT}}"
        msg: GO_JUNIT_REPORT_OUT is required. Pass GO_JUNIT_REPORT_OUT=path/to/junit.xml when running this task.
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}}; go-junit-report -in "{{.GO_JUNIT_REPORT_IN}}"
          -out "{{.GO_JUNIT_REPORT_OUT}}" -set-exit-code'
        platforms: [linux, darwin]
      - cmd: >-
          go-junit-report -in "{{.GO_JUNIT_REPORT_IN}}"
          -out "{{.GO_JUNIT_REPORT_OUT}}" -set-exit-code
        platforms: [windows]

  _which:unix:
    run: once
    internal: true
    desc: Show go-junit-report binary path on macOS or Linux
    summary: Print the go-junit-report binary path resolved by the current PATH on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; command -v go-junit-report'

  _which:windows:
    run: once
    internal: true
    desc: Show go-junit-report binary path on Windows
    summary: Print the go-junit-report binary path resolved by PowerShell on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command go-junit-report -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: go-junit-report is not installed or not available in PATH.
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -Command "(Get-Command go-junit-report).Source"

  _verify:unix:
    run: once
    internal: true
    desc: Verify go-junit-report on macOS or Linux
    summary: Print go-junit-report version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; go-junit-report -version'

  _verify:windows:
    run: once
    internal: true
    desc: Verify go-junit-report on Windows
    summary: Print go-junit-report version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command go-junit-report -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: go-junit-report is not installed or not available in PATH.
    cmds:
      - go-junit-report -version

  _version:unix:
    run: once
    internal: true
    desc: Show go-junit-report version on macOS or Linux
    summary: Print the go-junit-report version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; go-junit-report -version'

  _version:windows:
    run: once
    internal: true
    desc: Show go-junit-report version on Windows
    summary: Print the go-junit-report version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command go-junit-report -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: go-junit-report is not installed or not available in PATH.
    cmds:
      - go-junit-report -version
