---
version: "3.5"
output:

  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false
silent: true
includes:

  nix:
    taskfile: ../nix/Taskfile.yml
vars:

  GOLANGCI_LINT_NIX_INSTALLABLE: nixpkgs#go nixpkgs#golangci-lint

  # Formatter selection shared by every golangci-lint fmt invocation on Unix and

  # Windows. Kept in one place so the two call sites cannot drift apart.

  GOLANGCI_LINT_FMT_FORMATTER_FLAGS: >-
    -E gci -E gofmt -E gofumpt -E goimports -E golines -E swaggo
tasks:
  default:
    run: once
    desc: Show available golangci-lint automation tasks
    summary: Display the list of available golangci-lint-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install golangci-lint via the Nix profile
    summary: |
      Install golangci-lint into the user Nix profile when it is not already
      available on PATH. Override the GOLANGCI_LINT_NIX_INSTALLABLE
      variable to pin a different package or version.
    status:
      - >-
        bash -lc '{{.NIX_LOAD}};
        {{if .GO_GLOBAL_BIN}}export PATH="{{.GO_GLOBAL_BIN}}:$PATH";
        {{end}}command -v golangci-lint >/dev/null 2>&1'
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.GOLANGCI_LINT_NIX_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active golangci-lint version
    summary: |
      Print the version reported by the golangci-lint binary resolved from PATH.
      Auto-installs golangci-lint if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  lint:
    run: once
    desc: Lint Go packages with golangci-lint
    summary: |
      Run golangci-lint against all Go packages by default. Pass CLI arguments
      after -- to override the default ./... target.
      Auto-installs golangci-lint if missing. When .custom-gcl.yml exists in the
      working directory, builds or reuses its custom binary instead.
    deps:
      - task: install
    cmds:
      - task: _lint
        vars:
          GO_LINT_FIX: ""
          GO_LINT_ARGS: "{{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}./...{{end}}"

  lint:fix:
    run: once
    desc: Auto-fix Go lint issues with golangci-lint
    summary: |
      Run golangci-lint with --fix against all Go packages by default. Pass CLI
      arguments after -- to override the default ./... target. Auto-installs
      golangci-lint if missing. When
      .custom-gcl.yml exists in the working directory, builds or reuses its
      custom binary instead.
    deps:
      - task: install
    cmds:
      - task: _lint
        vars:
          GO_LINT_FIX: "--fix"
          GO_LINT_ARGS: "{{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}./...{{end}}"

  ci:
    run: once
    desc: Run golangci-lint fmt:check then lint
    cmds:
      - task: fmt:check
      - task: lint

  ci:fix:
    run: once
    desc: Run fmt then lint:fix for CI
    summary: |
      Run fmt then lint:fix. Applies formatting and automatic lint fixes
      suitable for CI autofix workflows.
    cmds:
      - task: fmt
      - task: lint:fix

  fmt:
    run: once
    desc: Format Go files with golangci-lint formatters
    summary: |
      Rewrite Go files with golangci-lint's gci, gofmt, gofumpt, goimports,
      golines, and swaggo formatters. Pass CLI arguments after -- to override
      the default target. Auto-installs golangci-lint if missing.
    deps:
      - task: install
    cmds:
      - task: _fmt
        vars:
          GO_FMT_DIFF: ""
          GO_FMT_TARGETS: "{{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}.{{end}}"

  fmt:check:
    run: once
    desc: Check Go formatting with golangci-lint formatters
    summary: |
      Check Go files with golangci-lint's gci, gofmt, gofumpt, goimports,
      golines, and swaggo formatters by printing diffs instead of rewriting
      files. Pass CLI arguments after -- to override the default target.
      Auto-installs golangci-lint if missing.
    deps:
      - task: install
    cmds:
      - task: _fmt
        vars:
          GO_FMT_DIFF: "--diff"
          GO_FMT_TARGETS: "{{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}.{{end}}"

  _custom:
    run: once
    internal: true
    dir: "{{.USER_WORKING_DIR}}"
    if: test -f .custom-gcl.yml
    method: checksum
    vars:
      CUSTOM_GCL_YAML:
        sh: if [ -f .custom-gcl.yml ]; then cat .custom-gcl.yml; else printf '{}'; fi
      CUSTOM_GCL:
        ref: fromYaml .CUSTOM_GCL_YAML
      CUSTOM_GCL_NAME: '{{default "custom-gcl" .CUSTOM_GCL.name}}'
      CUSTOM_GCL_DESTINATION: '{{default "." .CUSTOM_GCL.destination}}'
      CUSTOM_GCL_BINARY_NAME: "{{.CUSTOM_GCL_NAME}}{{exeExt}}"
      CUSTOM_GCL_BINARY: "{{joinPath .CUSTOM_GCL_DESTINATION .CUSTOM_GCL_BINARY_NAME}}"
    sources:
      - .custom-gcl.yml
    generates:
      - "{{.CUSTOM_GCL_BINARY}}"
    cmds:
      - >-
        bash -lc '{{.NIX_LOAD}};
        {{if .GO_GLOBAL_BIN}}export PATH="{{.GO_GLOBAL_BIN}}:$PATH"; {{end}}golangci-lint custom -v'

  _lint:
    run: once
    internal: true
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: _custom
    vars:
      CUSTOM_GCL_ENABLED:
        sh: if [ -f .custom-gcl.yml ]; then printf true; else printf false; fi
      CUSTOM_GCL_YAML:
        sh: if [ -f .custom-gcl.yml ]; then cat .custom-gcl.yml; else printf '{}'; fi
      CUSTOM_GCL:
        ref: fromYaml .CUSTOM_GCL_YAML
      CUSTOM_GCL_NAME: '{{default "custom-gcl" .CUSTOM_GCL.name}}'
      CUSTOM_GCL_DESTINATION: '{{default "." .CUSTOM_GCL.destination}}'
      CUSTOM_GCL_BINARY_NAME: "{{.CUSTOM_GCL_NAME}}{{exeExt}}"
      CUSTOM_GCL_BINARY: "{{joinPath .CUSTOM_GCL_DESTINATION .CUSTOM_GCL_BINARY_NAME}}"
    cmds:
      - cmd: |
          bash -lc '{{.NIX_LOAD}}; exec bash -s' <<'GCL_LINT_EOF'
          {{if .GO_GLOBAL_BIN}}export PATH="{{.GO_GLOBAL_BIN}}:$PATH"{{end}}
          lint_binary="golangci-lint"
          if [ "{{.CUSTOM_GCL_ENABLED}}" = "true" ]; then
            case "{{.CUSTOM_GCL_BINARY}}" in
              /*) lint_binary="{{.CUSTOM_GCL_BINARY}}" ;;
              *) lint_binary="./{{.CUSTOM_GCL_BINARY}}" ;;
            esac
          fi

          "$lint_binary" run {{.GO_LINT_FIX}} {{.GO_LINT_ARGS}}
          GCL_LINT_EOF
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $lintBinary =
          'golangci-lint'; if ('{{.CUSTOM_GCL_ENABLED}}' -eq 'true') {

            $lintBinary = '{{.CUSTOM_GCL_BINARY}}'; if (-not [System.IO.Path]::IsPathRooted($lintBinary)) {

              $lintBinary = Join-Path (Get-Location) $lintBinary;
            }
          }; & $lintBinary run
            {{.GO_LINT_FIX}}
            {{.GO_LINT_ARGS}}; exit $LASTEXITCODE"
        platforms: [windows]

  _fmt:
    run: once
    internal: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - cmd: |
          bash -lc '{{.NIX_LOAD}};
          {{if .GO_GLOBAL_BIN}}export PATH="{{.GO_GLOBAL_BIN}}:$PATH"; {{end}}golangci-lint fmt \
            {{.GO_FMT_DIFF}} \
            {{.GOLANGCI_LINT_FMT_FORMATTER_FLAGS}} \
            {{.GO_FMT_TARGETS}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop';
            & golangci-lint fmt
              {{.GO_FMT_DIFF}}
              {{.GOLANGCI_LINT_FMT_FORMATTER_FLAGS}}
              {{.GO_FMT_TARGETS}};
            exit $LASTEXITCODE"
        platforms: [windows]

  _version:unix:
    run: once
    internal: true
    desc: Show golangci-lint version on macOS or Linux
    summary: Print the golangci-lint version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}}; {{if .GO_GLOBAL_BIN}}export PATH="{{.GO_GLOBAL_BIN}}:$PATH"; {{end}}
          golangci-lint --version'

  _version:windows:
    run: once
    internal: true
    desc: Show golangci-lint version on Windows
    summary: Print the golangci-lint version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command golangci-lint -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: golangci-lint is not installed or not available in PATH.
    cmds:
      - golangci-lint --version
