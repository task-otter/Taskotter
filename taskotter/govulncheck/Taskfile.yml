---
version: "3.5"
output:

  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false
silent: true
includes:

  go:
    taskfile: ../go/Taskfile.yml
  nix:
    taskfile: ../nix/Taskfile.yml
vars:

  GOVULNCHECK_NIX_INSTALLABLE: '{{.GOVULNCHECK_NIX_INSTALLABLE | default "nixpkgs#go nixpkgs#govulncheck"}}'

  GOVULNCHECK_GO_PKG: '{{.GOVULNCHECK_GO_PKG | default "golang.org/x/vuln/cmd/govulncheck@latest"}}'
tasks:
  default:
    run: once
    desc: Show available govulncheck automation tasks
    summary: Display the list of available govulncheck-related tasks defined in this Taskfile.
    cmds:
      - task --list

  ci:
    run: once
    desc: Scan Go packages with govulncheck
    summary: |
      Scan all Go packages for known vulnerabilities by default. Pass CLI
      arguments after -- to override the default ./... target. Auto-installs
      govulncheck if missing.
    deps:
      - task: install
    cmds:
      - task: _scan

  install:
    run: once
    desc: Install govulncheck via Nix (Unix) or go install (Windows)
    summary: |
      Install govulncheck into the user Nix profile on Linux and macOS when
      it is not already on PATH (the installable also provides Go). On
      Windows, installs via go:install:pkg using GOVULNCHECK_GO_PKG.
      Override GOVULNCHECK_NIX_INSTALLABLE or GOVULNCHECK_GO_PKG to pin a
      different package or version.
    status:
      - command -v govulncheck >/dev/null 2>&1
    cmds:
      - task: _install:unix
      - task: _install:windows

  _install:unix:
    internal: true
    platforms: [linux, darwin]
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.GOVULNCHECK_NIX_INSTALLABLE}}"

  _install:windows:
    internal: true
    platforms: [windows]
    cmds:
      - task: go:install:pkg
        vars:
          GO_PKG: "{{.GOVULNCHECK_GO_PKG}}"

  version:
    run: once
    desc: Show the active govulncheck version
    summary: |
      Print the version reported by the govulncheck binary resolved from PATH.
      Auto-installs govulncheck if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  _scan:
    internal: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - cmd: |
          bash -lc '{{.NIX_LOAD}};
          govulncheck \
            {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}./...{{end}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "govulncheck
            {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}./...{{end}};
          exit $LASTEXITCODE"
        platforms: [windows]

  _version:unix:
    run: once
    internal: true
    desc: Show govulncheck version on macOS or Linux
    summary: Print the govulncheck version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; govulncheck -version'

  _version:windows:
    run: once
    internal: true
    desc: Show govulncheck version on Windows
    summary: Print the govulncheck version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command govulncheck -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: govulncheck is not installed or not available in PATH.
    cmds:
      - govulncheck -version
