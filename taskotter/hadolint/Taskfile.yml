---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  HADOLINT_CONFIG: '{{.HADOLINT_CONFIG | default ""}}'
  HADOLINT_DOCKERFILE: '{{.HADOLINT_DOCKERFILE | default "Dockerfile"}}'
  HADOLINT_EXTRA_ARGS: '{{.HADOLINT_EXTRA_ARGS | default ""}}'
  HADOLINT_NIX_INSTALLABLE: '{{.HADOLINT_NIX_INSTALLABLE | default "nixpkgs#hadolint"}}'

tasks:
  default:
    run: once
    desc: Show available hadolint automation tasks
    summary: Display the list of available hadolint-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install hadolint via the Nix profile
    summary: |
      Install hadolint into the user Nix profile when it is not already
      available on PATH. Override the HADOLINT_NIX_INSTALLABLE
      variable to pin a different package or version.
    status:
      - command -v hadolint >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.HADOLINT_NIX_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active hadolint version
    summary: |
      Print the version reported by the hadolint binary resolved from PATH.
      Auto-installs hadolint if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  ci:
    run: once
    desc: Lint a Dockerfile with hadolint (HADOLINT_DOCKERFILE=path)
    summary: |
      Run hadolint against DOCKERFILE (default: Dockerfile). Pass HADOLINT_CONFIG to
      use a custom config file via --config, and HADOLINT_EXTRA_ARGS for additional
      flags such as --ignore or --format. Pass CLI arguments after -- to
      override targets and options. Auto-installs hadolint if missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - cmd: |
          bash -lc '{{.NIX_LOAD}};
          dockerfile="{{.HADOLINT_DOCKERFILE}}"
          hadolint \
            {{if .CLI_ARGS}}{{.CLI_ARGS}} \
            {{else}}{{if .HADOLINT_CONFIG}}--config "{{.HADOLINT_CONFIG}}"{{end}} \
            "$dockerfile" {{.HADOLINT_EXTRA_ARGS}}{{end}} \
            && echo "✅ hadolint passed" || { echo "❌ hadolint failed"; exit 1; }'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "$dockerfile='{{.HADOLINT_DOCKERFILE}}';
          hadolint {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}
            {{if .HADOLINT_CONFIG}}--config '{{.HADOLINT_CONFIG}}'{{end}}
            $dockerfile {{.HADOLINT_EXTRA_ARGS}}{{end}};
          exit $LASTEXITCODE"
        platforms: [windows]

  _version:unix:
    run: once
    internal: true
    desc: Show hadolint version on macOS or Linux
    summary: Print the hadolint version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; hadolint --version'

  _version:windows:
    run: once
    internal: true
    desc: Show hadolint version on Windows
    summary: Print the hadolint version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command hadolint -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: hadolint is not installed or not available in PATH.
    cmds:
      - hadolint --version
