---
version: '3.5'
output:
  group:
    begin: ::group::{{.TASK}}
    end: '::endgroup::'
    error_only: false
silent: true
includes:
  nix:
    taskfile: ../nix/Taskfile.yml
  winget:
    taskfile: ../winget/Taskfile.yml
vars:
  RUMDL_TARGETS: '{{.RUMDL_TARGETS | default "."}}'
  RUMDL_EXTRA_ARGS: '{{.RUMDL_EXTRA_ARGS | default ""}}'
  RUMDL_NIX_INSTALLABLE: '{{.RUMDL_NIX_INSTALLABLE | default "nixpkgs#rumdl"}}'
  RUMDL_WINGET_INSTALLABLE: '{{.RUMDL_WINGET_INSTALLABLE | default "rvben.rumdl"}}'
tasks:
  default:
    run: once
    desc: Show available rumdl automation tasks
    summary: Display the list of available rumdl-related tasks defined in this Taskfile.
    cmds: [task --list]
  install:
    run: once
    desc: Install rumdl via Nix (Unix) or WinGet (Windows)
    summary: |
      Install rumdl into the user Nix profile on Linux and macOS when it
      is not already on PATH. On Windows, WinGet installs rumdl
      (RUMDL_WINGET_INSTALLABLE). Override RUMDL_NIX_INSTALLABLE or
      RUMDL_WINGET_INSTALLABLE to pin a different package or version.
    status: [command -v rumdl >/dev/null 2>&1]
    cmds:
      - task: _install:unix
      - task: _install:windows
  _install:unix:
    internal: true
    platforms: [linux, darwin]
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: '{{.RUMDL_NIX_INSTALLABLE}}'
  _install:windows:
    internal: true
    platforms: [windows]
    cmds:
      - task: winget:install:package
        vars:
          WINGET_INSTALLABLE: '{{.RUMDL_WINGET_INSTALLABLE}}'
  version:
    run: once
    desc: Show the active rumdl version
    summary: |
      Print the version reported by the rumdl binary resolved from PATH.
      Auto-installs rumdl if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows
  _version:unix:
    run: once
    internal: true
    desc: Show rumdl version on macOS or Linux
    summary: Print the rumdl version on macOS or Linux.
    platforms: [linux, darwin]
    cmds: ["bash -lc '{{.NIX_LOAD}}; rumdl --version'"]
  _version:windows:
    run: once
    internal: true
    desc: Show rumdl version on Windows
    summary: Print the rumdl version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}};
          if (Get-Command rumdl -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: rumdl is not installed or not available in PATH.
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "{{.WINGET_LOAD}}; rumdl --version; exit \$LASTEXITCODE"

  # Shared implementation of ci / ci:fix. Each override is resolved exactly
  # once here; callers supply the subcommand and any trailing shell reporting.
  _run:
    internal: true
    run: when_changed
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: install
    vars:
      PATHS: '{{or .RUMDL_TARGETS "."}}'
      EXTRA: '{{.RUMDL_EXTRA_ARGS}}'
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          rumdl {{.SUBCMD}}
          {{.PATHS}}{{if .EXTRA}} {{.EXTRA}}{{end}}{{.TAIL}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}};
          rumdl {{.SUBCMD}} {{.PATHS}}{{if .EXTRA}} {{.EXTRA}}{{end}};
          exit \$LASTEXITCODE"
        platforms: [windows]
  ci:
    run: once
    desc: Lint Markdown files with rumdl (RUMDL_TARGETS=path)
    summary: |
      Run rumdl check against RUMDL_TARGETS (default .). Pass RUMDL_EXTRA_ARGS for
      additional flags. Auto-installs rumdl if missing.
    cmds:
      - task: _run
        vars:
          SUBCMD: check
          TAIL: ' && echo "✅ rumdl passed" || { echo "❌ rumdl failed"; exit 1; }'
  ci:fix:
    run: once
    desc: Format Markdown files with rumdl (RUMDL_TARGETS=path)
    summary: |
      Run rumdl fmt against RUMDL_TARGETS (default .). Uses formatter-style
      exit codes and exits zero after successful formatting
      even if unfixable violations remain. Pass RUMDL_EXTRA_ARGS for additional
      flags. Auto-installs rumdl if missing.
    cmds:
      - task: _run
        vars:
          SUBCMD: fmt
