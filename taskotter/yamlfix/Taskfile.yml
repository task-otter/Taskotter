---
version: "3.5"
output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false
silent: true
includes:
  nix:
    taskfile: ../nix/Taskfile.yml
vars:
  YAMLFIX_NIX_INSTALLABLE: nixpkgs#yamlfix
  YAMLFIX_TARGETS: "."
  YAMLFIX_EXTRA_ARGS: ""
tasks:
  default:
    run: once
    desc: Show available yamlfix automation tasks
    summary: Display the list of available yamlfix-related tasks defined in this Taskfile.
    cmds:
      - task --list
  install:
    run: once
    desc: Install yamlfix via the Nix profile
    summary: |
      Install yamlfix into the user Nix profile when it is not already
      available on PATH. Override the YAMLFIX_NIX_INSTALLABLE
      variable to pin a different package or version.
    status:
      - command -v yamlfix >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.YAMLFIX_NIX_INSTALLABLE}}"
  version:
    run: once
    desc: Show the active yamlfix version
    summary: |
      Print the version reported by the yamlfix binary resolved from PATH.
      Auto-installs yamlfix if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows
  ci:fix:
    run: once
    dir: "{{.USER_WORKING_DIR}}"
    desc: Auto-fix YAML files with yamlfix (YAMLFIX_TARGETS=path)
    summary: |
      Run yamlfix against YAML files found under YAMLFIX_TARGETS (default .). Excludes
      Taskfile.yml files whose Go template syntax is incompatible with yamlfix.
      Pass YAMLFIX_EXTRA_ARGS for additional flags. Auto-installs yamlfix if missing.
    deps:
      - task: install
    cmds:
      - >-
        bash -lc '{{.NIX_LOAD}};
        _t="{{if .YAMLFIX_TARGETS}}{{.YAMLFIX_TARGETS}}{{else}}.{{end}}";
        [ -d "$_t" ] || _t="."; find "$_t" \( -name "*.yml" -o -name "*.yaml"
        \) ! -name "Taskfile.yml" ! -name "Taskfile.yaml" -print0 | xargs -0 yamlfix {{.YAMLFIX_EXTRA_ARGS}}'
  _version:unix:
    run: once
    internal: true
    desc: Show yamlfix version on macOS or Linux
    summary: Print the yamlfix version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; yamlfix --version'
  _version:windows:
    run: once
    internal: true
    desc: Show yamlfix version on Windows
    summary: Print the yamlfix version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command yamlfix -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: yamlfix is not installed or not available in PATH.
    cmds:
      - yamlfix --version
