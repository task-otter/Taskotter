---
version: "3.5"
output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false
silent: true
includes:
  nix:
    taskfile: ../nix/Taskfile.yml
vars:
  YAMLLINT_NIX_INSTALLABLE: nixpkgs#yamllint
  YAMLLINT_TARGETS: "."
  YAMLLINT_CONFIG: ""
  YAMLLINT_EXTRA_ARGS: ""
tasks:
  default:
    run: once
    desc: Show available yamllint automation tasks
    summary: Display the list of available yamllint-related tasks defined in this Taskfile.
    cmds:
      - task --list
  install:
    run: once
    desc: Install yamllint via the Nix profile
    summary: |
      Install yamllint into the user Nix profile when it is not already
      available on PATH. Override the YAMLLINT_NIX_INSTALLABLE
      variable to pin a different package or version.
    status:
      - command -v yamllint >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.YAMLLINT_NIX_INSTALLABLE}}"
  version:
    run: once
    desc: Show the active yamllint version
    summary: |
      Print the version reported by the yamllint binary resolved from PATH.
      Auto-installs yamllint if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows
  ci:
    run: once
    dir: "{{.USER_WORKING_DIR}}"
    desc: Lint YAML files in strict mode for CI (YAMLLINT_TARGETS=path)
    summary: |
      Run yamllint --strict against YAMLLINT_TARGETS. Exits non-zero on warnings as
      well as errors, making it suitable for continuous integration pipelines.
      Auto-installs yamllint if missing.
    deps:
      - task: install
    cmds:
      - >-
        bash -lc '{{.NIX_LOAD}}; yamllint --strict {{if .YAMLLINT_CONFIG}}-c
        "{{.YAMLLINT_CONFIG}}" {{end}} {{if .YAMLLINT_TARGETS}}{{.YAMLLINT_TARGETS}}
        {{else}}.{{end}} {{.YAMLLINT_EXTRA_ARGS}}
        && echo "✅ yamllint passed" || { echo "❌ yamllint failed"; exit 1; }'
  config:init:
    run: once
    dir: "{{.USER_WORKING_DIR}}"
    desc: Create a default .yamllint configuration file
    summary: |
      Write a sensible default .yamllint file in the current directory.
      Extends yamllint defaults with a relaxed line-length limit and explicit
      truthy values. Skipped if .yamllint already exists.
    status:
      - test -f .yamllint
    cmds:
      - "printf 'extends: default\\n' > .yamllint"
      - "printf 'rules:\\n' >> .yamllint"
      - "printf '  line-length:\\n' >> .yamllint"
      - "printf '    max: 120\\n' >> .yamllint"
      - "printf '  truthy:\\n' >> .yamllint"
      - "printf \"    allowed-values: ['true', 'false']\\n\" >> .yamllint"
      - echo 'Created .yamllint with default configuration.'
  _version:unix:
    run: once
    internal: true
    desc: Show yamllint version on macOS or Linux
    summary: Print the yamllint version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; yamllint --version'
  _version:windows:
    run: once
    internal: true
    desc: Show yamllint version on Windows
    summary: Print the yamllint version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command yamllint -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: yamllint is not installed or not available in PATH.
    cmds:
      - yamllint --version
