---
version: "3"
includes:
  pnpm:
    taskfile: ../../../../pnpm/fnm/Taskfile.yml
vars:
  NODE_VERSION: "24"
tasks:
  install:
    cmds:
      - task: pnpm:install
  lint:
    cmds:
      - pnpm exec eslint .
  lint:fix:
    cmds:
      - pnpm exec eslint . --fix
  version:
    cmds:
      - pnpm exec eslint --version
